<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Admin Dashboard | CCMS</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header class="navbar">
            <a class="brand" href="index.html">
                <span class="brand-mark">C</span>
                <span>CCMS Authority</span>
            </a>
            <nav>
                <a href="admin-dashboard.html">Dashboard</a>
                <button class="btn btn-outline btn-small" onclick="CCMS.logout()">Logout</button>
            </nav>
        </header>
        <main class="dashboard">
            <div class="dashboard-head">
                <div>
                    <span class="eyebrow">ADMIN / AUTHORITY</span>
                    <h1>Complaint Management</h1>
                    <p>Review, assign and resolve citizen complaints.</p>
                </div>
            </div>
            <div id="adminStats" class="stats-grid">
            </div>
            <section class="panel">
                <div class="panel-head">
                    <div>
                        <h2>All Complaints</h2>
                        <p>Update the status as work progresses.</p>
                    </div>
                    <input id="adminSearch" class="search-input" placeholder="Search Complaint ID / category">
                </div>
                
<div class="table-wrap">
    <table class="data-table">
        <thead>
            <tr>
                <th>Complaint ID</th>
                <th>Citizen Name</th>
                <th>Category</th>
                <th>Location</th>
                <th>Status</th>
                <th>Department</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="adminComplaints">
        </tbody>
    </table>
</div>

            </section>
        </main>
       
        <script src="js/app.js"></script>
    </body>
</html>
