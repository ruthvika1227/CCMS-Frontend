<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Citizen Dashboard | CCMS</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header class="navbar">
            <a class="brand" href="index.html">
                <span class="brand-mark">C</span>
                <span>CCMS</span>
            </a>
            <nav>
                <a href="citizen-dashboard.html">Dashboard</a>
                <a href="complaint.html">New Complaint</a>
                <a href="track.html">Track</a>
                <button class="btn btn-outline btn-small" onclick="CCMS.logout()">Logout</button>
            </nav>
        </header>
        <main class="dashboard">
            <div class="dashboard-head">
                <div>
                    <span class="eyebrow">CITIZEN DASHBOARD</span>
                    <h1 id="welcomeName">Welcome, Citizen!</h1>
                    <p>Manage and monitor your civic complaints.</p>
                </div>
                <a class="btn btn-primary" href="complaint.html">＋ Register New Complaint</a>
            </div>
            <div id="dashboardStats" class="stats-grid">
            </div>
            <section class="panel">
                <div class="panel-head">
                    <div>
                        <h2>My Recent Complaints</h2>
                        <p>Your submitted complaints and their current status.</p>
                    </div>
                    <a href="track.html">Track by ID →</a>
                </div>
                <div id="myComplaints" class="table-wrap">
                </div>
            </section>
        </main>
        <script src="js/app.js">
        </script>
        <script>CCMS.initCitizenDashboard();</script>
    </body>
</html>
