<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Register Complaint | CCMS</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header class="navbar">
            <a class="brand" href="index.html">
                <span class="brand-mark">C</span>
                <span>CCMS</span>
            </a>
            <nav>
                <a href="index.html">Home</a>
                <a href="citizen-dashboard.html">Dashboard</a>
                <a href="track.html">Track</a>
            </nav>
        </header>
        <main class="page-container">
            <div class="page-title">
                <span class="eyebrow">REPORT A CIVIC ISSUE</span>
                <h1>Register Complaint</h1>
                <p>Provide accurate details so the concerned authority can act quickly.</p>
            </div>
            <section class="panel">
                <div id="complaintMessage">
                </div>
                <form id="complaintForm" class="form-grid">
                    <label>Name<input id="compName" required>
                </label>
                <label>Email<input id="compEmail" type="email" required>
            </label>
            <label>Mobile<input id="compMobile" required inputmode="numeric" maxlength="10">
        </label>
        <label>Category<select id="compCategory" required>
        <option value="">Select category</option>
        <option>Garbage</option>
        <option>Road Damage</option>
        <option>Water Supply</option>
        <option>Drainage</option>
        <option>Street Light</option>
    </select>
</label>
<label>Location / Address<input id="compLocation" required maxlength="250" placeholder="Where is the problem?">
</label>
<label>Date<input id="compDate" type="date" required>
</label>
<label class="full">Complaint Description<textarea id="compDescription" required rows="5" maxlength="1000" placeholder="Describe the civic problem clearly...">
</textarea>
</label>
<label class="full">Optional Photo / Evidence<input id="compPhoto" type="file" accept="image/*">
<small>Image is stored in browser localStorage for this prototype.</small>
</label>
<div id="imagePreview" class="image-preview full">
</div>
<div class="full">
    <button class="btn btn-primary" type="submit">Submit Complaint</button>
</div>
</form>
</section>
</main>
<script src="js/app.js">
</script>
<script>CCMS.initComplaint();</script>
</body>
</html>
