<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Register | CCMS</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body class="auth-bg">
        <header class="navbar">
            <a class="brand" href="index.html">
                <span class="brand-mark">C</span>
                <span>CCMS</span>
            </a>
            <nav>
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
            </nav>
        </header>
        <main class="auth-page">
            <section class="auth-card wide">
                <div class="auth-header">
                    <span class="eyebrow">CITIZEN ACCOUNT</span>
                    <h1>Create your account</h1>
                    <p>Register once to submit and track civic complaints.</p>
                </div>
                <div id="registerMessage">
                </div>
                <form id="registerForm" class="form-grid">
                    <label>Full Name<input id="regName" required maxlength="80" placeholder="Enter your full name">
                </label>
                <label>Email<input id="regEmail" type="email" required placeholder="name@example.com">
            </label>
            <label>Mobile Number<input id="regMobile" required inputmode="numeric" maxlength="10" placeholder="10-digit mobile number">
        </label>
        <label>Password<input id="regPassword" type="password" required minlength="6" placeholder="Minimum 6 characters">
    </label>
    <label>Confirm Password<input id="regConfirm" type="password" required placeholder="Re-enter password">
</label>
<label class="full">Address<textarea id="regAddress" required rows="3" maxlength="250" placeholder="Enter your address">
</textarea>
</label>
<div class="full">
    <button class="btn btn-primary" type="submit">Create Account</button>
</div>
</form>
<p class="auth-footer">Already have an account? <a href="login.html">Login here</a>
</p>
</section>
</main>
<script src="js/app.js">
</script>
</body>
</html>
